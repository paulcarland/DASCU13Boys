const genCode = () => { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };
const slug = (s) => (s || "team").replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "");
const hexToRgb = (hex) => { const n = parseInt(hex.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

/* ---------------------------------------------------------------
   CSV / pasted-spreadsheet parsing for player import
---------------------------------------------------------------- */
function splitDelimited(line, delim) {
  const out = []; let cur = ""; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; } }
      else cur += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === delim) { out.push(cur); cur = ""; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map((s) => s.trim());
}
function parseDelimitedText(text) {
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter((l) => l.trim().length > 0);
  if (lines.length === 0) return { headers: [], rows: [] };
  const commaCount = (lines[0].match(/,/g) || []).length;
  const tabCount = (lines[0].match(/\t/g) || []).length;
  const delim = tabCount > commaCount ? "\t" : ",";
  return { headers: splitDelimited(lines[0], delim), rows: lines.slice(1).map((l) => splitDelimited(l, delim)) };
}
const normalizeHeader = (h) => (h || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const HEADER_ALIASES = {
  name: ["name", "playername", "player", "fullname"],
  parentName: ["parentname", "parent", "guardian", "parentguardian", "guardianname", "parent1", "parent1name", "guardian1", "guardian1name"],
  parentEmail: ["email", "parentemail", "guardianemail", "parent1email", "guardian1email"],
  parentName2: ["parentname2", "parent2", "guardian2", "secondparent", "parent2name", "guardian2name"],
  parentEmail2: ["email2", "parentemail2", "guardianemail2", "secondparentemail", "parent2email"],
  openingBalance: ["balance", "openingbalance", "opening", "startingbalance"],
  notes: ["notes", "note", "comments", "comment"],
};
function mapHeaders(headers) {
  const norm = headers.map(normalizeHeader);
  const map = {};
  for (const field in HEADER_ALIASES) {
    const idx = norm.findIndex((h) => HEADER_ALIASES[field].includes(h));
    if (idx !== -1) map[field] = idx;
  }
  return map;
}
function buildImportPreview(text, existingNames) {
  const { headers, rows } = parseDelimitedText(text);
  if (headers.length === 0) return { error: null, items: [] };
  const map = mapHeaders(headers);
  if (map.name === undefined) return { error: 'Couldn\u2019t find a "Name" column. Make sure the first row has headers like Name, Parent Name, Parent Email, Opening Balance.', items: [] };
  const items = rows.map((r) => {
    const name = (r[map.name] || "").trim();
    const parentName = map.parentName !== undefined ? (r[map.parentName] || "").trim() : "";
    const parentEmail = map.parentEmail !== undefined ? (r[map.parentEmail] || "").trim() : "";
    const parentName2 = map.parentName2 !== undefined ? (r[map.parentName2] || "").trim() : "";
    const parentEmail2 = map.parentEmail2 !== undefined ? (r[map.parentEmail2] || "").trim() : "";
    const balRaw = map.openingBalance !== undefined ? (r[map.openingBalance] || "").trim() : "";
    const openingBalance = balRaw ? (parseFloat(balRaw.replace(/[^0-9.-]/g, "")) || 0) : 0;
    const notes = map.notes !== undefined ? (r[map.notes] || "").trim() : "";
    return { name, parentName, parentEmail, parentName2, parentEmail2, openingBalance, notes, valid: !!name, duplicate: !!name && existingNames.has(name.toLowerCase()) };
  });
  return { error: null, items };
}
function downloadImportTemplate() {
  const csv = "Name,Parent Name,Parent Email,Parent Name 2,Parent Email 2,Opening Balance,Notes\nJordan Smith,Alex Smith,alex@example.com,Jamie Smith,jamie@example.com,0,\n";
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "player-import-template.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadBackupJSON(teamName, players, transactions) {
  const backup = { format: "team-treasury-backup", version: 1, exportedAt: new Date().toISOString(), teamName, players, transactions };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${slug(teamName)}-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function buildAccessCodeMailto(teamName, player) {
  const siteUrl = window.location.origin + window.location.pathname;
  const greetingName = player.parentName ? player.parentName.split(" ")[0] : "there";
  const subject = `${teamName} — Access code for ${player.name}`;
  const body = `Hi ${greetingName},\n\nHere's your access to the ${teamName} parent portal for ${player.name}:\n\nPlayer name: ${player.name}\nAccess code: ${player.accessCode}\n\nVisit ${siteUrl} and choose "Parent portal," then enter the player name and code above to view ${player.name}'s balance and statements anytime.\n\nThanks!`;
  let url = `mailto:${player.parentEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (player.parentEmail2) url += `&cc=${encodeURIComponent(player.parentEmail2)}`;
  return url;
}

function buildStatementMailto(teamName, player, month, stats) {
  const greetingName = player.parentName ? player.parentName.split(" ")[0] : "there";
  const lines = stats.rows.length
    ? stats.rows.map((t) => `  ${t.date} — ${t.category}${t.description ? " (" + t.description + ")" : ""}: ${t.direction === "debit" ? "+" : "-"}${fmtMoney(t.amount)}`).join("\n")
    : "  No activity this month.";
  const subject = `${teamName} — ${player.name}'s Statement — ${monthLabel(month)}`;
  const body = `Hi ${greetingName},\n\nHere is ${player.name}'s account statement for ${monthLabel(month)} from ${teamName}.\n\nBeginning balance: ${fmtMoney(stats.beginning)}\nDebits (charges): ${fmtMoney(stats.debits)}\nCredits (paid): ${fmtMoney(stats.credits)}\nEnding balance: ${fmtMoney(Math.abs(stats.ending))}${stats.ending > 0.004 ? " CR" : ""}\n\nTransactions this month:\n${lines}\n\nIf you have any questions, please don't hesitate to reach out.\n\nThanks,\n${teamName}`;
  let url = `mailto:${player.parentEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (player.parentEmail2) url += `&cc=${encodeURIComponent(player.parentEmail2)}`;
  return url;
}

async function commitInChunks(snapshot) {
  const docs = snapshot.docs;
  for (let i = 0; i < docs.length; i += 400) {
    const batch = window.db.batch();
    docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
    await batch.commit();
  }
}

/* ---------------------------------------------------------------
   Balance math
---------------------------------------------------------------- */
function buildLedger(players, transactions) {
  const byPlayer = {};
  for (const p of players) byPlayer[p.id] = [];
  for (const t of transactions) if (byPlayer[t.playerId]) byPlayer[t.playerId].push(t);
  for (const id in byPlayer) byPlayer[id].sort((a, b) => a.date.localeCompare(b.date));

  const currentBalance = (playerId) => {
    const p = players.find((pl) => pl.id === playerId);
    if (!p) return 0;
    let bal = Number(p.openingBalance) || 0;
    for (const t of byPlayer[playerId] || []) bal += t.direction === "credit" ? t.amount : -t.amount;
    return bal;
  };

  const monthStats = (playerId, monthStr) => {
    const p = players.find((pl) => pl.id === playerId);
    let beginning = Number(p?.openingBalance) || 0;
    const inMonth = [];
    for (const t of byPlayer[playerId] || []) {
      const tMonth = t.date.slice(0, 7);
      if (tMonth < monthStr) beginning += t.direction === "credit" ? t.amount : -t.amount;
      else if (tMonth === monthStr) inMonth.push(t);
    }
    let debits = 0, credits = 0, running = beginning;
    const rows = inMonth.map((t) => {
      running += t.direction === "credit" ? t.amount : -t.amount;
      if (t.direction === "debit") debits += t.amount; else credits += t.amount;
      return { ...t, running };
    });
    return { beginning, debits, credits, ending: beginning + credits - debits, rows };
  };
  return { currentBalance, monthStats };
}
function useLedger(players, transactions) {
  return useMemo(() => buildLedger(players, transactions), [players, transactions]);
}

          <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Paste rows straight from a spreadsheet, or upload a CSV file. Include a header row — <b>Name</b> is required; Parent Name, Parent Email, Parent Name 2, Parent Email 2, Opening Balance, and Notes are optional.</p>
          <div className="flex items-center gap-3 mb-3 flex-wrap">
            <label className="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold cursor-pointer" style={{ border: `1px solid ${C.line}`, color: C.ink }}>
              📄 Choose CSV file<input type="file" accept=".csv,text/csv" className="hidden" onChange={onFileChosen} />
            </label>
            <button onClick={downloadImportTemplate} className="text-sm font-semibold" style={{ color: C.pitchDark }}>Download template</button>
          </div>
          <textarea value={importText} onChange={(e) => setImportText(e.target.value)} rows={5} placeholder={"Name, Parent Name, Parent Email, Opening Balance, Notes\nJordan Smith, Alex Smith, alex@example.com, 0,"} style={inputStyle} className="w-full rounded-lg px-3 py-2 text-sm outline-none font-mono" />

          {importPreview && importPreview.error && <p className="text-xs font-semibold mt-2" style={{ color: C.debit }}>{importPreview.error}</p>}

          {importPreview && !importPreview.error && importPreview.items.length > 0 && (<>
            <div className="flex items-center gap-4 mt-3 mb-2 flex-wrap text-xs font-semibold">
              <span style={{ color: C.credit }}>{validItems.length} ready to import</span>
              {invalidCount > 0 && <span style={{ color: C.debit }}>{invalidCount} skipped (missing name)</span>}
              {duplicateCount > 0 && <span style={{ color: C.amber }}>{duplicateCount} possible duplicate{duplicateCount === 1 ? "" : "s"} of existing players</span>}
            </div>
            <div className="rounded-xl mb-3" style={{ border: `1px solid ${C.line}`, maxHeight: 260, overflowY: "auto", overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
              <table className="w-full text-sm" style={{ minWidth: 560 }}>
                <thead><tr className="text-left" style={{ background: C.lineSoft, color: C.inkSoft }}><th className="font-semibold px-3 py-2">Name</th><th className="font-semibold px-3 py-2">Parent(s)</th><th className="font-semibold px-3 py-2">Email(s)</th><th className="font-semibold px-3 py-2 text-right">Opening</th><th className="font-semibold px-3 py-2">Status</th></tr></thead>
                <tbody>{importPreview.items.map((it, i) => (
                  <tr key={i} className="border-t" style={{ borderColor: C.lineSoft, opacity: it.valid ? 1 : 0.5 }}>
                    <td className="px-3 py-2 font-semibold" style={{ color: C.ink }}>{it.name || "—"}</td>
                    <td className="px-3 py-2" style={{ color: C.inkSoft }}>{[it.parentName, it.parentName2].filter(Boolean).join(", ") || "—"}</td>
                    <td className="px-3 py-2" style={{ color: C.inkSoft }}>{[it.parentEmail, it.parentEmail2].filter(Boolean).join(", ") || "—"}</td>
                    <td className="px-3 py-2 text-right" style={{ color: C.inkSoft, fontVariantNumeric: "tabular-nums" }}>{fmtMoney(it.openingBalance)}</td>
                    <td className="px-3 py-2 text-xs font-semibold" style={{ color: !it.valid ? C.debit : it.duplicate ? C.amber : C.credit }}>{!it.valid ? "Missing name" : it.duplicate ? "Possible duplicate" : "Ready"}</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </>)}

          <div className="flex items-center gap-3 flex-wrap">
            <Button disabled={importBusy || validItems.length === 0} onClick={confirmImport}>{importBusy ? <Spinner size={14} color="#fff" /> : "⬆"} Import {validItems.length || ""} player{validItems.length === 1 ? "" : "s"}</Button>
            <Button variant="ghost" onClick={() => { setShowImport(false); setImportText(""); setImportMsg(""); }}>Cancel</Button>
            {importMsg && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>{importMsg}</p>}
          </div>
        </div>
      )}
      {showAdd && (
        <div className="rounded-2xl p-5 mb-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="font-black mb-3" style={{ color: C.ink }}>New player</p>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Player name"><TextInput value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Full name" /></Field>
            <Field label="Opening balance" hint="Positive = credit on file (prepaid), negative = amount owed"><TextInput type="number" step="0.01" value={form.openingBalance} onChange={(e) => setForm({ ...form, openingBalance: e.target.value })} /></Field>
            <Field label="Parent/guardian name"><TextInput value={form.parentName} onChange={(e) => setForm({ ...form, parentName: e.target.value })} /></Field>
            <Field label="Parent email"><TextInput type="email" value={form.parentEmail} onChange={(e) => setForm({ ...form, parentEmail: e.target.value })} /></Field>
            <Field label="Second parent/guardian name (optional)"><TextInput value={form.parentName2} onChange={(e) => setForm({ ...form, parentName2: e.target.value })} /></Field>
            <Field label="Second parent email (optional)"><TextInput type="email" value={form.parentEmail2} onChange={(e) => setForm({ ...form, parentEmail2: e.target.value })} /></Field>
            <div className="sm:col-span-2"><Field label="Notes" hint="e.g. payment plan details, fee waivers"><TextInput value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field></div>
          </div>
          <div className="flex gap-2 mt-4"><Button onClick={submitAdd}>✓ Add player</Button><Button variant="ghost" onClick={() => { setShowAdd(false); resetForm(); }}>Cancel</Button></div>
        </div>
      )}
      {editingId && editForm && (
        <div className="rounded-2xl p-5 mb-5" style={{ background: C.surface, border: `1px solid ${C.pitch}` }}>
          <p className="font-black mb-3" style={{ color: C.ink }}>Edit player</p>
          <div className="grid sm:grid-cols-2 gap-3">
            <Field label="Player name"><TextInput value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} /></Field>
            <div />
            <Field label="Parent/guardian name"><TextInput value={editForm.parentName} onChange={(e) => setEditForm({ ...editForm, parentName: e.target.value })} /></Field>
            <Field label="Parent email"><TextInput type="email" value={editForm.parentEmail} onChange={(e) => setEditForm({ ...editForm, parentEmail: e.target.value })} /></Field>
            <Field label="Second parent/guardian name (optional)"><TextInput value={editForm.parentName2} onChange={(e) => setEditForm({ ...editForm, parentName2: e.target.value })} /></Field>
            <Field label="Second parent email (optional)"><TextInput type="email" value={editForm.parentEmail2} onChange={(e) => setEditForm({ ...editForm, parentEmail2: e.target.value })} /></Field>
            <div className="sm:col-span-2"><Field label="Notes"><TextInput value={editForm.notes} onChange={(e) => setEditForm({ ...editForm, notes: e.target.value })} /></Field></div>
          </div>
          <div className="flex gap-2 mt-4"><Button onClick={saveEdit}>✓ Save changes</Button><Button variant="ghost" onClick={() => { setEditingId(null); setEditForm(null); }}>Cancel</Button></div>
        </div>
      )}
      {players.length === 0 ? <EmptyState title="No players yet" body="Add your first player to start tracking fees and payments." /> : (
        <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="table-scroll">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ background: C.lineSoft, color: C.inkSoft }}><th className="font-semibold px-4 py-3">Player</th><th className="font-semibold px-4 py-3">Parent contact</th><th className="font-semibold px-4 py-3">Access code</th><th className="font-semibold px-4 py-3 text-right">Balance</th><th className="font-semibold px-4 py-3 text-right">Actions</th></tr></thead>
            <tbody>{filtered.map((p, i) => (
              <tr key={p.id} className="border-t" style={{ borderColor: C.lineSoft, opacity: p.active ? 1 : 0.5 }}>
                <td className="px-4 py-3"><div className="flex items-center gap-2.5"><JerseyBadge n={i + 1} /><div><button onClick={() => onOpenStatement(p.id)} className="font-bold hover:underline text-left" style={{ color: C.ink }}>{p.name}</button>{!p.active && <p className="text-xs" style={{ color: C.inkSoft }}>Inactive</p>}</div></div></td>
                <td className="px-4 py-3" style={{ color: C.inkSoft }}>
                  <div>{p.parentName || "—"}</div>{p.parentEmail && <div className="text-xs">{p.parentEmail}</div>}
                  {(p.parentName2 || p.parentEmail2) && <div className="mt-1">{p.parentName2 || "—"}</div>}{p.parentEmail2 && <div className="text-xs">{p.parentEmail2}</div>}
                </td>
                <td className="px-4 py-3"><div className="flex items-center gap-1.5"><code className="px-2 py-1 rounded-md text-xs font-bold tracking-wide" style={{ background: C.pitchTint, color: C.pitchDark }}>{p.accessCode}</code>
                  <button onClick={() => copyCode(p)} title="Copy code" className="text-xs" style={{ color: C.inkSoft }}>{copiedId === p.id ? "✓" : "⧉"}</button>
                  <button onClick={() => updatePlayer(p.id, { accessCode: genCode() })} title="Regenerate code" style={{ color: C.inkSoft }}>↻</button>
                  {p.parentEmail ? (
                    <a href={buildAccessCodeMailto(teamName, p)} title={`Email code to ${p.parentEmail}`} style={{ color: C.inkSoft, textDecoration: "none" }}>✉</a>
                  ) : (
                    <span title="No parent email on file — add one to enable this" style={{ color: C.line, cursor: "default" }}>✉</span>
                  )}
                </div></td>
                <td className="px-4 py-3 text-right"><MoneyText value={ledger.currentBalance(p.id)} /></td>
                <td className="px-4 py-3"><div className="flex items-center justify-end gap-3">
                  <button onClick={() => startEdit(p)} className="text-xs font-semibold" style={{ color: C.pitchDark }}>Edit</button>
                  <button onClick={() => updatePlayer(p.id, { active: !p.active })} className="text-xs font-semibold" style={{ color: C.pitchDark }}>{p.active ? "Deactivate" : "Reactivate"}</button>
                  <button onClick={() => { if (confirm("Remove this player and all of their transactions? This can't be undone.")) deletePlayer(p.id); }} title="Delete player" style={{ color: C.debit }}>🗑</button>
                </div></td>
              </tr>
            ))}</tbody>
          </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin: Transactions tab
---------------------------------------------------------------- */
function TransactionsTab({ teamName, players, transactions, addTxn, addBulkTxn, deleteTxn, updateTxn, presetPlayerId }) {
  const [mode, setMode] = useState("single");
  const [form, setForm] = useState({ playerId: presetPlayerId || (players[0]?.id ?? ""), date: todayStr(), direction: "debit", category: DEBIT_CATEGORIES[0], amount: "", description: "" });
  const [bulkForm, setBulkForm] = useState({ date: todayStr(), direction: "debit", category: DEBIT_CATEGORIES[0], amount: "", description: "" });
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [bulkQuery, setBulkQuery] = useState("");
  const [bulkBusy, setBulkBusy] = useState(false);
  const [bulkMsg, setBulkMsg] = useState("");
  const [filterPlayer, setFilterPlayer] = useState("all"); const [filterMonth, setFilterMonth] = useState("");
  useEffect(() => { if (presetPlayerId) setForm((f) => ({ ...f, playerId: presetPlayerId })); }, [presetPlayerId]);
  const cats = form.direction === "debit" ? DEBIT_CATEGORIES : CREDIT_CATEGORIES;
  const bulkCats = bulkForm.direction === "debit" ? DEBIT_CATEGORIES : CREDIT_CATEGORIES;
  const numberOf = useMemo(() => players.reduce((acc, p, idx) => (acc[p.id] = idx + 1, acc), {}), [players]);

  const submit = async () => {
    if (!form.playerId || !form.amount || Number(form.amount) <= 0) return;
    await addTxn({ playerId: form.playerId, date: form.date, direction: form.direction, category: form.category, amount: parseFloat(form.amount), description: form.description.trim(), createdAt: Date.now() });
    setForm({ ...form, amount: "", description: "" });
  };

  const [editingTxnId, setEditingTxnId] = useState(null);
  const [editTxnForm, setEditTxnForm] = useState(null);
  const editTxnCats = editTxnForm?.direction === "debit" ? DEBIT_CATEGORIES : CREDIT_CATEGORIES;
  const startEditTxn = (t) => {
    setEditingTxnId(t.id);
    setEditTxnForm({ playerId: t.playerId, date: t.date, direction: t.direction, category: t.category, amount: String(t.amount), description: t.description || "" });
  };
  const saveEditTxn = async () => {
    if (!editTxnForm.playerId || !editTxnForm.amount || Number(editTxnForm.amount) <= 0) return;
    await updateTxn(editingTxnId, { playerId: editTxnForm.playerId, date: editTxnForm.date, direction: editTxnForm.direction, category: editTxnForm.category, amount: parseFloat(editTxnForm.amount), description: editTxnForm.description.trim() });
    setEditingTxnId(null); setEditTxnForm(null);
  };

  const bulkFiltered = players.filter((p) => p.name.toLowerCase().includes(bulkQuery.toLowerCase()));
  const toggleOne = (id) => setSelectedIds((prev) => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
  const selectAllFiltered = () => setSelectedIds((prev) => { const next = new Set(prev); bulkFiltered.forEach((p) => next.add(p.id)); return next; });
  const clearAllFiltered = () => setSelectedIds((prev) => { const next = new Set(prev); bulkFiltered.forEach((p) => next.delete(p.id)); return next; });
  const selectActiveOnly = () => setSelectedIds(new Set(players.filter((p) => p.active).map((p) => p.id)));

  const submitBulk = async () => {
    if (selectedIds.size === 0 || !bulkForm.amount || Number(bulkForm.amount) <= 0) return;
    setBulkBusy(true); setBulkMsg("");
    try {
      const ids = Array.from(selectedIds);
      await addBulkTxn(ids, { date: bulkForm.date, direction: bulkForm.direction, category: bulkForm.category, amount: parseFloat(bulkForm.amount), description: bulkForm.description.trim(), createdAt: Date.now() });
      setBulkMsg(`${bulkForm.direction === "debit" ? "Charged" : "Credited"} ${ids.length} player${ids.length === 1 ? "" : "s"} ${fmtMoney(parseFloat(bulkForm.amount))} each.`);
      setSelectedIds(new Set());
      setBulkForm({ ...bulkForm, amount: "", description: "" });
    } catch (e) { setBulkMsg("Something went wrong — please try again."); }
    setBulkBusy(false);
  };

  const playerName = (id) => players.find((p) => p.id === id)?.name || "—";
  const rows = transactions.filter((t) => filterPlayer === "all" || t.playerId === filterPlayer).filter((t) => !filterMonth || t.date.slice(0, 7) === filterMonth).sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));

  return (
    <div>
      <div className="rounded-2xl p-5 mb-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <p className="font-black" style={{ color: C.ink }}>Log a transaction</p>
          <div className="flex rounded-lg overflow-hidden" style={{ border: `1px solid ${C.line}` }}>
            <button onClick={() => setMode("single")} className="px-3 py-1.5 text-sm font-semibold" style={{ background: mode === "single" ? C.pitchTint : "transparent", color: mode === "single" ? C.pitchDark : C.inkSoft }}>Single</button>
            <button onClick={() => setMode("bulk")} className="px-3 py-1.5 text-sm font-semibold" style={{ background: mode === "bulk" ? C.pitchTint : "transparent", color: mode === "bulk" ? C.pitchDark : C.inkSoft }}>Bulk</button>
          </div>
        </div>

        {players.length === 0 ? <p className="text-sm" style={{ color: C.inkSoft }}>Add a player first on the Roster tab.</p> : mode === "single" ? (<>
          <div className="grid sm:grid-cols-3 gap-3">
            <Field label="Player"><Select value={form.playerId} onChange={(e) => setForm({ ...form, playerId: e.target.value })}>{players.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</Select></Field>
            <Field label="Date"><TextInput type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="Type"><div className="flex rounded-lg overflow-hidden" style={{ border: `1px solid ${C.line}` }}>
              <button onClick={() => setForm({ ...form, direction: "debit", category: DEBIT_CATEGORIES[0] })} className="flex-1 py-2 text-sm font-semibold" style={{ background: form.direction === "debit" ? C.debitTint : "transparent", color: form.direction === "debit" ? C.debit : C.inkSoft }}>Charge</button>
              <button onClick={() => setForm({ ...form, direction: "credit", category: CREDIT_CATEGORIES[0] })} className="flex-1 py-2 text-sm font-semibold" style={{ background: form.direction === "credit" ? C.creditTint : "transparent", color: form.direction === "credit" ? C.credit : C.inkSoft }}>Payment</button>
            </div></Field>
            <Field label="Category"><Select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>{cats.map((c) => <option key={c} value={c}>{c}</option>)}</Select></Field>
            <Field label="Amount"><TextInput type="number" step="0.01" min="0" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} placeholder="0.00" /></Field>
            <Field label="Description (optional)"><TextInput value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} placeholder="e.g. Spring tournament" /></Field>
          </div>
          <Button className="mt-4" onClick={submit}>+ Add transaction</Button>
        </>) : (<>
          <div className="grid sm:grid-cols-3 gap-3 mb-4">
            <Field label="Date"><TextInput type="date" value={bulkForm.date} onChange={(e) => setBulkForm({ ...bulkForm, date: e.target.value })} /></Field>
            <Field label="Type"><div className="flex rounded-lg overflow-hidden" style={{ border: `1px solid ${C.line}` }}>
              <button onClick={() => setBulkForm({ ...bulkForm, direction: "debit", category: DEBIT_CATEGORIES[0] })} className="flex-1 py-2 text-sm font-semibold" style={{ background: bulkForm.direction === "debit" ? C.debitTint : "transparent", color: bulkForm.direction === "debit" ? C.debit : C.inkSoft }}>Charge</button>
              <button onClick={() => setBulkForm({ ...bulkForm, direction: "credit", category: CREDIT_CATEGORIES[0] })} className="flex-1 py-2 text-sm font-semibold" style={{ background: bulkForm.direction === "credit" ? C.creditTint : "transparent", color: bulkForm.direction === "credit" ? C.credit : C.inkSoft }}>Payment</button>
            </div></Field>
            <Field label="Category"><Select value={bulkForm.category} onChange={(e) => setBulkForm({ ...bulkForm, category: e.target.value })}>{bulkCats.map((c) => <option key={c} value={c}>{c}</option>)}</Select></Field>
            <Field label="Amount (each)"><TextInput type="number" step="0.01" min="0" value={bulkForm.amount} onChange={(e) => setBulkForm({ ...bulkForm, amount: e.target.value })} placeholder="0.00" /></Field>
            <div className="sm:col-span-2"><Field label="Description (optional)"><TextInput value={bulkForm.description} onChange={(e) => setBulkForm({ ...bulkForm, description: e.target.value })} placeholder="e.g. Fall registration" /></Field></div>
          </div>

          <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
            <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.inkSoft }}>Select players — {selectedIds.size} selected</p>
            <div className="flex items-center gap-3 flex-wrap">
              <input value={bulkQuery} onChange={(e) => setBulkQuery(e.target.value)} placeholder="🔍 Search…" style={inputStyle} className="rounded-lg px-2 py-1 text-xs outline-none w-40" />
              <button onClick={selectActiveOnly} className="text-xs font-semibold" style={{ color: C.pitchDark }}>Active only</button>
              <button onClick={selectAllFiltered} className="text-xs font-semibold" style={{ color: C.pitchDark }}>Select all</button>
              <button onClick={clearAllFiltered} className="text-xs font-semibold" style={{ color: C.inkSoft }}>Clear</button>
            </div>
          </div>
          <div className="rounded-xl mb-4" style={{ border: `1px solid ${C.line}`, maxHeight: 260, overflowY: "auto" }}>
            {bulkFiltered.map((p) => (
              <label key={p.id} className="flex items-center gap-2.5 px-3 py-2 border-t" style={{ borderColor: C.lineSoft, cursor: "pointer", opacity: p.active ? 1 : 0.5 }}>
                <input type="checkbox" checked={selectedIds.has(p.id)} onChange={() => toggleOne(p.id)} />
                <JerseyBadge n={numberOf[p.id]} />
                <span className="text-sm font-semibold" style={{ color: C.ink }}>{p.name}</span>
                {!p.active && <span className="text-xs" style={{ color: C.inkSoft }}>Inactive</span>}
              </label>
            ))}
            {bulkFiltered.length === 0 && <p className="text-sm px-3 py-4" style={{ color: C.inkSoft }}>No players match.</p>}
          </div>

          <div className="flex items-center gap-3 flex-wrap">
            <Button disabled={bulkBusy || selectedIds.size === 0} onClick={submitBulk}>{bulkBusy ? <Spinner size={14} color="#fff" /> : "+"} Apply to {selectedIds.size} player{selectedIds.size === 1 ? "" : "s"}</Button>
            {bulkMsg && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>{bulkMsg}</p>}
          </div>
        </>)}
      </div>
      {editingTxnId && editTxnForm && (
        <div className="rounded-2xl p-5 mb-5" style={{ background: C.surface, border: `1px solid ${C.pitch}` }}>
          <p className="font-black mb-3" style={{ color: C.ink }}>Edit transaction</p>
          <div className="grid sm:grid-cols-3 gap-3">
            <Field label="Player"><Select value={editTxnForm.playerId} onChange={(e) => setEditTxnForm({ ...editTxnForm, playerId: e.target.value })}>{players.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</Select></Field>
            <Field label="Date"><TextInput type="date" value={editTxnForm.date} onChange={(e) => setEditTxnForm({ ...editTxnForm, date: e.target.value })} /></Field>
            <Field label="Type"><div className="flex rounded-lg overflow-hidden" style={{ border: `1px solid ${C.line}` }}>
              <button onClick={() => setEditTxnForm({ ...editTxnForm, direction: "debit", category: DEBIT_CATEGORIES[0] })} className="flex-1 py-2 text-sm font-semibold" style={{ background: editTxnForm.direction === "debit" ? C.debitTint : "transparent", color: editTxnForm.direction === "debit" ? C.debit : C.inkSoft }}>Charge</button>
              <button onClick={() => setEditTxnForm({ ...editTxnForm, direction: "credit", category: CREDIT_CATEGORIES[0] })} className="flex-1 py-2 text-sm font-semibold" style={{ background: editTxnForm.direction === "credit" ? C.creditTint : "transparent", color: editTxnForm.direction === "credit" ? C.credit : C.inkSoft }}>Payment</button>
            </div></Field>
            <Field label="Category"><Select value={editTxnForm.category} onChange={(e) => setEditTxnForm({ ...editTxnForm, category: e.target.value })}>{editTxnCats.map((c) => <option key={c} value={c}>{c}</option>)}</Select></Field>
            <Field label="Amount"><TextInput type="number" step="0.01" min="0" value={editTxnForm.amount} onChange={(e) => setEditTxnForm({ ...editTxnForm, amount: e.target.value })} /></Field>
            <Field label="Description (optional)"><TextInput value={editTxnForm.description} onChange={(e) => setEditTxnForm({ ...editTxnForm, description: e.target.value })} /></Field>
          </div>
          <div className="flex gap-2 mt-4"><Button onClick={saveEditTxn}>✓ Save changes</Button><Button variant="ghost" onClick={() => { setEditingTxnId(null); setEditTxnForm(null); }}>Cancel</Button></div>
        </div>
      )}
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <Select value={filterPlayer} onChange={(e) => setFilterPlayer(e.target.value)} className="w-auto"><option value="all">All players</option>{players.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</Select>
        <input type="month" value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)} style={inputStyle} className={`${inputClass} w-auto`} />
        {filterMonth && <button onClick={() => setFilterMonth("")} className="text-xs font-semibold" style={{ color: C.inkSoft }}>Clear month</button>}
        <ExportButton onExport={() => exportTransactionsPDF(teamName, rows, playerName, filterMonth)} className="ml-auto" />
      </div>
      {rows.length === 0 ? <EmptyState title="No transactions" body="Logged fees, deposits, and payments will show up here." /> : (
        <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="table-scroll">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ background: C.lineSoft, color: C.inkSoft }}><th className="font-semibold px-4 py-3">Date</th><th className="font-semibold px-4 py-3">Player</th><th className="font-semibold px-4 py-3">Category</th><th className="font-semibold px-4 py-3">Description</th><th className="font-semibold px-4 py-3 text-right">Amount</th><th className="font-semibold px-4 py-3 text-right"></th></tr></thead>
            <tbody>{rows.map((t) => (
              <tr key={t.id} className="border-t" style={{ borderColor: C.lineSoft }}>
                <td className="px-4 py-3" style={{ color: C.ink }}>{t.date}</td><td className="px-4 py-3 font-semibold" style={{ color: C.ink }}>{playerName(t.playerId)}</td>
                <td className="px-4 py-3"><span className="text-xs font-semibold px-2 py-1 rounded-full" style={{ background: t.direction === "debit" ? C.debitTint : C.creditTint, color: t.direction === "debit" ? C.debit : C.credit }}>{t.category}</span></td>
                <td className="px-4 py-3" style={{ color: C.inkSoft }}>{t.description || "—"}</td>
                <td className="px-4 py-3 text-right font-bold" style={{ color: t.direction === "debit" ? C.debit : C.credit, fontVariantNumeric: "tabular-nums" }}>{t.direction === "debit" ? "−" : "+"}{fmtMoney(t.amount)}</td>
                <td className="px-4 py-3 text-right"><div className="flex items-center justify-end gap-3">
                  <button onClick={() => startEditTxn(t)} className="text-xs font-semibold" style={{ color: C.pitchDark }}>Edit</button>
                  <button onClick={() => { if (confirm("Delete this transaction?")) deleteTxn(t.id); }} style={{ color: C.inkSoft }}>🗑</button>
                </div></td>
              </tr>
            ))}</tbody>
          </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin: Statements tab
---------------------------------------------------------------- */
function StatementsTab({ teamName, players, ledger, initialPlayerId, onConsumedInitial }) {
  const [month, setMonth] = useState(thisMonthStr());
  const [openPlayerId, setOpenPlayerId] = useState(initialPlayerId || null);
  useEffect(() => { if (initialPlayerId) { setOpenPlayerId(initialPlayerId); onConsumedInitial && onConsumedInitial(); } }, [initialPlayerId]);
  const summary = players.map((p) => ({ player: p, ...ledger.monthStats(p.id, month) }));
  const totals = summary.reduce((a, r) => ({ beginning: a.beginning + r.beginning, debits: a.debits + r.debits, credits: a.credits + r.credits, ending: a.ending + r.ending }), { beginning: 0, debits: 0, credits: 0, ending: 0 });

  if (openPlayerId) {
    const p = players.find((pl) => pl.id === openPlayerId);
    const idx = players.findIndex((pl) => pl.id === openPlayerId);
    if (!p) { setOpenPlayerId(null); return null; }
    return <StatementDetail teamName={teamName} player={p} jerseyNo={idx + 1} month={month} setMonth={setMonth} stats={ledger.monthStats(p.id, month)} onBack={() => setOpenPlayerId(null)} allowEmail />;
  }
  return (
    <div>
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <p className="font-black" style={{ color: C.ink }}>Monthly statement — {monthLabel(month)}</p>
        <div className="flex items-center gap-2">
          <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} style={inputStyle} className={`${inputClass} w-auto`} />
          <ExportButton onExport={() => exportSummaryPDF(teamName, summary, totals, month)} />
        </div>
      </div>
      {players.length === 0 ? <EmptyState title="Nothing to show yet" body="Add players and transactions to generate statements." /> : (
        <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="table-scroll">
          <table className="w-full text-sm">
            <thead><tr className="text-left" style={{ background: C.lineSoft, color: C.inkSoft }}><th className="font-semibold px-4 py-3">Player</th><th className="font-semibold px-4 py-3 text-right">Beginning</th><th className="font-semibold px-4 py-3 text-right">Debits</th><th className="font-semibold px-4 py-3 text-right">Credits</th><th className="font-semibold px-4 py-3 text-right">Ending</th><th className="font-semibold px-4 py-3 text-right"></th></tr></thead>
            <tbody>{summary.map((r, i) => (
              <tr key={r.player.id} className="border-t" style={{ borderColor: C.lineSoft }}>
                <td className="px-4 py-3"><button onClick={() => setOpenPlayerId(r.player.id)} className="flex items-center gap-2.5 font-bold hover:underline" style={{ color: C.ink }}><JerseyBadge n={i + 1} /> {r.player.name}</button></td>
                <td className="px-4 py-3 text-right" style={{ color: C.inkSoft, fontVariantNumeric: "tabular-nums" }}>{fmtMoney(r.beginning)}</td>
                <td className="px-4 py-3 text-right font-semibold" style={{ color: C.debit }}>{r.debits ? fmtMoney(r.debits) : "—"}</td>
                <td className="px-4 py-3 text-right font-semibold" style={{ color: C.credit }}>{r.credits ? fmtMoney(r.credits) : "—"}</td>
                <td className="px-4 py-3 text-right"><MoneyText value={r.ending} /></td>
                <td className="px-4 py-3 text-right"><button onClick={() => setOpenPlayerId(r.player.id)} style={{ color: C.inkSoft }}>›</button></td>
              </tr>
            ))}</tbody>
            <tfoot><tr className="border-t-2" style={{ borderColor: C.line, background: C.lineSoft }}>
              <td className="px-4 py-3 font-black" style={{ color: C.ink }}>Team total</td>
              <td className="px-4 py-3 text-right font-bold" style={{ color: C.ink }}>{fmtMoney(totals.beginning)}</td>
              <td className="px-4 py-3 text-right font-bold" style={{ color: C.debit }}>{fmtMoney(totals.debits)}</td>
              <td className="px-4 py-3 text-right font-bold" style={{ color: C.credit }}>{fmtMoney(totals.credits)}</td>
              <td className="px-4 py-3 text-right font-bold" style={{ color: C.ink }}>{fmtMoney(totals.ending)}</td>
              <td></td>
            </tr></tfoot>
          </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin: Seasons (archive) panel
---------------------------------------------------------------- */
function SeasonsPanel({ teamName, players, transactions, onArchiveSeason }) {
  const [archives, setArchives] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [label, setLabel] = useState("");
  const [carryForward, setCarryForward] = useState(true);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [expandedId, setExpandedId] = useState(null);

  const loadArchives = async () => {
    setLoading(true);
    try {
      const snap = await window.db.collection("archives").orderBy("archivedAt", "desc").get();
      setArchives(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    } catch (e) { setArchives([]); }
    setLoading(false);
  };
  useEffect(() => { loadArchives(); }, []);

  const confirmArchive = async () => {
    if (!confirm(`This moves all ${players.length} players and ${transactions.length} transactions into a permanent "${label.trim() || "Season archive"}" record, then clears the live transaction list${carryForward ? " (each player's current balance becomes their new opening balance)" : " and resets every player's balance to zero"}. This cannot be undone. Continue?`)) return;
    setBusy(true); setMsg("");
    try {
      await onArchiveSeason(label, carryForward);
      setMsg("Season archived — the live roster now starts fresh.");
      setLabel(""); setShowForm(false);
      await loadArchives();
    } catch (e) { setMsg("Something went wrong — please try again."); }
    setBusy(false);
  };

  return (
    <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <p className="font-black mb-2" style={{ color: C.ink }}>Seasons</p>
      <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Close out a season by moving its transaction history into a permanent, read-only record — the live roster and balances start clean for the next one. Players stay on the roster; only the transaction ledger and balances reset.</p>

      {!showForm ? (
        <Button variant="ghost" onClick={() => setShowForm(true)}>+ Archive current season</Button>
      ) : (
        <div className="rounded-xl p-4 mb-2" style={{ background: C.lineSoft }}>
          <Field label="Season label" hint='e.g. "2025–2026 Fall Season"'>
            <TextInput value={label} onChange={(e) => setLabel(e.target.value)} placeholder="Season label" />
          </Field>
          <label className="flex items-center gap-2 mt-3 text-sm" style={{ color: C.ink }}>
            <input type="checkbox" checked={carryForward} onChange={(e) => setCarryForward(e.target.checked)} />
            Carry forward each player's current balance as their new opening balance
          </label>
          <div className="flex items-center gap-3 mt-4 flex-wrap">
            <Button variant="danger" disabled={busy} onClick={confirmArchive}>{busy ? <Spinner size={14} /> : "📦"} Archive & start fresh</Button>
            <Button variant="ghost" onClick={() => { setShowForm(false); setLabel(""); }}>Cancel</Button>
          </div>
        </div>
      )}
      {msg && <p className="text-sm font-semibold mt-2 mb-2" style={{ color: C.pitchDark }}>{msg}</p>}

      <div className="mt-5 pt-5" style={{ borderTop: `1px solid ${C.lineSoft}` }}>
        <p className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: C.inkSoft }}>Past seasons</p>
        {loading ? <Spinner size={16} /> : archives.length === 0 ? (
          <p className="text-sm" style={{ color: C.inkSoft }}>No archived seasons yet.</p>
        ) : (
          <div className="grid gap-2">
            {archives.map((a) => {
              const archivePlayers = a.players || [];
              const archiveTransactions = a.transactions || [];
              const archiveLedger = buildLedger(archivePlayers, archiveTransactions);
              return (
                <div key={a.id} className="rounded-xl p-3" style={{ border: `1px solid ${C.line}` }}>
                  <button onClick={() => setExpandedId(expandedId === a.id ? null : a.id)} className="w-full flex items-center justify-between text-left">
                    <div>
                      <p className="font-bold text-sm" style={{ color: C.ink }}>{a.label}</p>
                      <p className="text-xs" style={{ color: C.inkSoft }}>Archived {new Date(a.archivedAt).toLocaleDateString()} · {archivePlayers.length} players · {archiveTransactions.length} transactions</p>
                    </div>
                    <span style={{ color: C.inkSoft }}>{expandedId === a.id ? "▾" : "›"}</span>
                  </button>
                  {expandedId === a.id && (
                    <div className="flex items-center gap-3 mt-3 pt-3 flex-wrap" style={{ borderTop: `1px solid ${C.lineSoft}` }}>
                      <ExportButton label="Roster PDF" onExport={() => exportRosterPDF(a.teamName || teamName, archivePlayers, archiveLedger)} />
                      <Button variant="ghost" onClick={() => downloadBackupJSON(a.label, archivePlayers, archiveTransactions)}>⬇ Download JSON</Button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin: Settings tab
---------------------------------------------------------------- */
function SettingsTab({ teamName, setTeamName, parentMessage, setParentMessage, players, transactions, onChangePin, onResetAll, onRestoreBackup, onArchiveSeason }) {
  const [name, setName] = useState(teamName);
  useEffect(() => setName(teamName), [teamName]);

  const [msgDraft, setMsgDraft] = useState(parentMessage);
  useEffect(() => setMsgDraft(parentMessage), [parentMessage]);
  const [msgSaved, setMsgSaved] = useState(false);
  const saveMsg = async () => {
    await setParentMessage(msgDraft);
    setMsgSaved(true);
    setTimeout(() => setMsgSaved(false), 1500);
  };

  const [restorePreview, setRestorePreview] = useState(null);
  const [restoreError, setRestoreError] = useState("");
  const [restoreBusy, setRestoreBusy] = useState(false);
  const [restoreMsg, setRestoreMsg] = useState("");

  const onBackupFileChosen = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setRestoreError(""); setRestoreMsg(""); setRestorePreview(null);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result || ""));
        if (!Array.isArray(parsed.players) || !Array.isArray(parsed.transactions)) throw new Error("bad shape");
        setRestorePreview(parsed);
      } catch (err) { setRestoreError("That doesn't look like a valid backup file from this app."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  const confirmRestore = async () => {
    if (!restorePreview) return;
    if (!confirm(`This will permanently DELETE all current players and transactions and replace them with the backup from ${new Date(restorePreview.exportedAt).toLocaleString()}. This cannot be undone. Continue?`)) return;
    setRestoreBusy(true); setRestoreMsg("");
    try {
      await onRestoreBackup(restorePreview);
      setRestoreMsg("Backup restored successfully.");
      setRestorePreview(null);
    } catch (err) { setRestoreMsg("Something went wrong — please try again."); }
    setRestoreBusy(false);
  };

  return (
    <div className="grid gap-5 max-w-lg">
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-3" style={{ color: C.ink }}>Team name</p>
        <div className="flex gap-2"><TextInput value={name} onChange={(e) => setName(e.target.value)} /><Button onClick={() => setTeamName(name)}>Save</Button></div>
      </div>
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.ink }}>Parent portal message</p>
        <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Shown to every parent on their player's account page — good for a quick note like an upcoming payment deadline or a reminder about tournament fees. Leave blank to hide it entirely.</p>
        <TextArea rows={3} value={msgDraft} onChange={(e) => setMsgDraft(e.target.value)} placeholder="e.g. Fall registration fees are due September 15th." />
        <div className="flex items-center gap-3 mt-3">
          <Button onClick={saveMsg}>Save message</Button>
          {msgSaved && <p className="text-sm font-semibold" style={{ color: C.pitchDark }}>✓ Saved</p>}
        </div>
      </div>
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.ink }}>Treasurer PIN</p>
        <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Change the PIN used to unlock this dashboard.</p>
        <Button variant="ghost" onClick={onChangePin}>Change PIN</Button>
      </div>
      <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.ink }}>Backup & restore</p>
        <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Download a complete copy of every player and transaction. Keep it somewhere safe (email it to yourself, save it to a drive) so you can recover everything if this site or your Firebase project is ever lost.</p>
        <Button variant="ghost" onClick={() => downloadBackupJSON(teamName, players, transactions)}>⬇ Download full backup</Button>

        <div className="mt-5 pt-5" style={{ borderTop: `1px solid ${C.lineSoft}` }}>
          <p className="font-black mb-1" style={{ color: C.debit }}>Restore from backup</p>
          <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Only use this to recover from data loss — restoring a backup <b>replaces everything currently in the app</b> for every user.</p>
          <label className="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold cursor-pointer" style={{ border: `1px solid ${C.line}`, color: C.ink }}>
            📄 Choose backup file<input type="file" accept=".json,application/json" className="hidden" onChange={onBackupFileChosen} />
          </label>
          {restoreError && <p className="text-xs font-semibold mt-2" style={{ color: C.debit }}>{restoreError}</p>}
          {restorePreview && (
            <div className="mt-3">
              <p className="text-sm mb-3" style={{ color: C.ink }}>
                Backup from <b>{new Date(restorePreview.exportedAt).toLocaleString()}</b> — {restorePreview.players.length} player{restorePreview.players.length === 1 ? "" : "s"}, {restorePreview.transactions.length} transaction{restorePreview.transactions.length === 1 ? "" : "s"}.
              </p>
              <Button variant="danger" disabled={restoreBusy} onClick={confirmRestore}>{restoreBusy ? <Spinner size={14} /> : "⚠"} Restore this backup</Button>
            </div>
          )}
          {restoreMsg && <p className="text-sm font-semibold mt-2" style={{ color: C.pitchDark }}>{restoreMsg}</p>}
        </div>
      </div>
      <SeasonsPanel teamName={teamName} players={players} transactions={transactions} onArchiveSeason={onArchiveSeason} />
      <div className="rounded-2xl p-5" style={{ background: C.debitTint, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.debit }}>Reset all data</p>
        <p className="text-sm mb-3" style={{ color: C.inkSoft }}>Permanently erases every player and transaction. This cannot be undone.</p>
        <Button variant="danger" onClick={() => { if (confirm("This deletes every player and transaction permanently. Continue?")) onResetAll(); }}>🗑 Reset everything</Button>
      </div>
      <div className="rounded-2xl p-5" style={{ background: C.navyTint, border: `1px solid ${C.line}` }}>
        <p className="font-black mb-2" style={{ color: C.navy }}>Data & security</p>
        <p className="text-sm" style={{ color: C.inkSoft }}>This app stores data in your Firebase project with open access for anyone who has this site's link. It's suitable for informal team finances — avoid entering bank account numbers, SSNs, or other sensitive IDs.</p>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin: Dashboard tab
---------------------------------------------------------------- */
function DashboardTab({ players, transactions, ledger, onOpenStatement }) {
  const stats = useMemo(() => {
    let totalOwed = 0, totalCredit = 0;
    const numberOf = players.reduce((acc, p, idx) => (acc[p.id] = idx + 1, acc), {});
    const balances = players.map((p) => ({ player: p, balance: ledger.currentBalance(p.id) }));
    balances.forEach(({ balance }) => { if (balance < -0.004) totalOwed += -balance; else if (balance > 0.004) totalCredit += balance; });
    const owing = balances.filter((b) => b.balance < -0.004).sort((a, b) => a.balance - b.balance).slice(0, 8);
    const thisMonth = thisMonthStr();
    let monthCharged = 0, monthCollected = 0;
    transactions.forEach((t) => { if (t.date.slice(0, 7) === thisMonth) { if (t.direction === "debit") monthCharged += t.amount; else monthCollected += t.amount; } });
    const recent = [...transactions].sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 8);
    return { totalOwed, totalCredit, owing, monthCharged, monthCollected, recent, numberOf, activeCount: players.filter((p) => p.active).length };
  }, [players, transactions, ledger]);

  const playerName = (id) => players.find((p) => p.id === id)?.name || "—";

  return (
    <div>
      <div className="grid sm:grid-cols-4 gap-3 mb-5">
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.inkSoft }}>Active players</p>
          <p className="text-2xl font-black" style={{ color: C.ink }}>{stats.activeCount}</p>
        </div>
        <div className="rounded-2xl p-4" style={{ background: C.debitTint }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.debit }}>Total outstanding</p>
          <p className="text-2xl font-black" style={{ color: C.debit }}>{fmtMoney(stats.totalOwed)}</p>
        </div>
        <div className="rounded-2xl p-4" style={{ background: C.creditTint }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.credit }}>Credit on file</p>
          <p className="text-2xl font-black" style={{ color: C.credit }}>{fmtMoney(stats.totalCredit)}</p>
        </div>
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.inkSoft }}>Collected this month</p>
          <p className="text-2xl font-black" style={{ color: C.ink }}>{fmtMoney(stats.monthCollected)}</p>
          <p className="text-xs mt-1" style={{ color: C.inkSoft }}>{fmtMoney(stats.monthCharged)} charged</p>
        </div>
      </div>

      <div className="grid lg:grid-cols-2 gap-5">
        <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="font-black mb-3" style={{ color: C.ink }}>Players with a balance due</p>
          {stats.owing.length === 0 ? <p className="text-sm" style={{ color: C.inkSoft }}>Nobody currently owes anything. 🎉</p> : (
            <div className="grid gap-1">
              {stats.owing.map(({ player, balance }) => (
                <button key={player.id} onClick={() => onOpenStatement(player.id)} className="flex items-center justify-between py-2 px-1 rounded-lg hover:opacity-80" style={{ borderTop: `1px solid ${C.lineSoft}` }}>
                  <span className="flex items-center gap-2.5 font-semibold text-sm" style={{ color: C.ink }}><JerseyBadge n={stats.numberOf[player.id]} /> {player.name}</span>
                  <MoneyText value={balance} />
                </button>
              ))}
            </div>
          )}
        </div>
        <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <p className="font-black mb-3" style={{ color: C.ink }}>Recent activity</p>
          {stats.recent.length === 0 ? <p className="text-sm" style={{ color: C.inkSoft }}>No transactions logged yet.</p> : (
            <div className="grid gap-1">
              {stats.recent.map((t) => (
                <div key={t.id} className="flex items-center justify-between py-2 px-1 text-sm" style={{ borderTop: `1px solid ${C.lineSoft}` }}>
                  <div>
                    <p className="font-semibold" style={{ color: C.ink }}>{playerName(t.playerId)}</p>
                    <p className="text-xs" style={{ color: C.inkSoft }}>{t.date} · {t.category}</p>
                  </div>
                  <span className="font-bold" style={{ color: t.direction === "debit" ? C.debit : C.credit }}>{t.direction === "debit" ? "−" : "+"}{fmtMoney(t.amount)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   Admin shell
---------------------------------------------------------------- */
function AdminShell({ teamName, setTeamName, parentMessage, setParentMessage, players, transactions, addPlayer, addPlayersBulk, updatePlayer, deletePlayer, addTxn, addBulkTxn, deleteTxn, updateTxn, onLock, onResetAll, onRestoreBackup, onArchiveSeason }) {
  const [tab, setTab] = useState("dashboard");
  const [statementPlayerId, setStatementPlayerId] = useState(null);
  const [txnPresetPlayer] = useState(null);
  const ledger = useLedger(players, transactions);
  const tabs = [["dashboard", "Dashboard"], ["roster", "Roster"], ["transactions", "Transactions"], ["statements", "Statements"], ["settings", "Settings"]];
  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      <header className="flex items-center justify-between px-5 py-4 print:hidden" style={{ borderBottom: `1px solid ${C.line}` }}>
        <div className="flex items-center gap-2 min-w-0"><span className="rounded-lg flex items-center justify-center text-white" style={{ width: 30, height: 30, flexShrink: 0, background: C.pitch }}>🛡</span><p className="font-black truncate" style={{ color: C.ink }}>{teamName}</p></div>
        <button onClick={onLock} className="text-sm font-semibold" style={{ color: C.inkSoft, flexShrink: 0 }}>Lock</button>
      </header>
      <nav className="flex gap-1 px-5 pt-4 print:hidden tab-scroll">
        {tabs.map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} className="px-3.5 py-2 rounded-t-lg text-sm font-semibold" style={{ background: tab === id ? C.surface : "transparent", color: tab === id ? C.pitchDark : C.inkSoft, border: tab === id ? `1px solid ${C.line}` : "1px solid transparent", borderBottom: tab === id ? `1px solid ${C.surface}` : "1px solid transparent", marginBottom: -1 }}>{label}</button>
        ))}
      </nav>
      <main className="p-5" style={{ borderTop: `1px solid ${C.line}` }}>
        {tab === "dashboard" && <DashboardTab players={players} transactions={transactions} ledger={ledger} onOpenStatement={(id) => { setStatementPlayerId(id); setTab("statements"); }} />}
        {tab === "roster" && <RosterTab teamName={teamName} players={players} ledger={ledger} addPlayer={addPlayer} addPlayersBulk={addPlayersBulk} updatePlayer={updatePlayer} deletePlayer={deletePlayer} onOpenStatement={(id) => { setStatementPlayerId(id); setTab("statements"); }} />}
        {tab === "transactions" && <TransactionsTab teamName={teamName} players={players} transactions={transactions} addTxn={addTxn} addBulkTxn={addBulkTxn} deleteTxn={deleteTxn} updateTxn={updateTxn} presetPlayerId={txnPresetPlayer} />}
        {tab === "statements" && <StatementsTab teamName={teamName} players={players} ledger={ledger} initialPlayerId={statementPlayerId} onConsumedInitial={() => setStatementPlayerId(null)} />}
        {tab === "settings" && <SettingsTab teamName={teamName} setTeamName={setTeamName} parentMessage={parentMessage} setParentMessage={setParentMessage} players={players} transactions={transactions} onChangePin={() => onLock(true)} onResetAll={onResetAll} onRestoreBackup={onRestoreBackup} onArchiveSeason={onArchiveSeason} />}
      </main>
    </div>
  );
}

/* ---------------------------------------------------------------
   Parent portal
---------------------------------------------------------------- */
function ParentGate({ players, onVerified, onBack }) {
  const [name, setName] = useState(""); const [code, setCode] = useState(""); const [err, setErr] = useState("");
  const submit = () => {
    if (!name.trim() || !code.trim()) { setErr("Enter your player's name and access code."); return; }
    const match = players.find((p) => p.name.trim().toLowerCase() === name.trim().toLowerCase() && p.accessCode === code.trim().toUpperCase());
    if (match) onVerified(match.id); else setErr("We couldn't find that player and code combination. Check with your team treasurer.");
  };
  return (
    <div className="min-h-screen flex items-center justify-center px-4 py-16" style={{ background: C.bg }}>
      <div className="w-full max-w-sm">
        <button onClick={onBack} className="text-sm font-semibold mb-6" style={{ color: C.inkSoft }}>← Back</button>
        <div className="rounded-2xl p-6" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <h2 className="font-black text-lg" style={{ color: C.ink }}>👥 Parent portal</h2>
          <p className="text-sm mt-1 mb-4" style={{ color: C.inkSoft }}>Enter your player's name exactly as registered, plus the access code from your treasurer.</p>
          <div className="grid gap-3">
            <Field label="Player name"><TextInput value={name} onChange={(e) => { setName(e.target.value); setErr(""); }} placeholder="Full name" style={err ? { borderColor: C.debit } : undefined} /></Field>
            <Field label="Access code"><TextInput value={code} onChange={(e) => { setCode(e.target.value); setErr(""); }} placeholder="6-character code" onKeyDown={(e) => e.key === "Enter" && submit()} style={err ? { borderColor: C.debit } : undefined} /></Field>
            {err && <p className="text-xs font-semibold" style={{ color: C.debit }}>⚠ {err}</p>}
            <Button variant="dark" onClick={submit}>View account</Button>
          </div>
        </div>
      </div>
    </div>
  );
}
function ParentView({ teamName, parentMessage, players, transactions, playerId, onLogout }) {
  const ledger = useLedger(players, transactions);
  const [month, setMonth] = useState(thisMonthStr());
  const player = players.find((p) => p.id === playerId);
  const idx = players.findIndex((p) => p.id === playerId);
  if (!player) return null;
  const stats = ledger.monthStats(playerId, month);
  const balance = ledger.currentBalance(playerId);
  const label = balance < -0.004 ? "Amount due" : balance > 0.004 ? "Credit balance" : "Paid in full";
  return (
    <div style={{ background: C.bg, minHeight: "100vh" }}>
      <header className="flex items-center justify-between px-5 py-4 print:hidden" style={{ borderBottom: `1px solid ${C.line}` }}>
        <p className="font-black truncate" style={{ color: C.ink }}>{teamName}</p>
        <button onClick={onLogout} className="text-sm font-semibold" style={{ color: C.inkSoft, flexShrink: 0 }}>Sign out</button>
      </header>
      <main className="p-5 max-w-2xl mx-auto">
        {parentMessage && parentMessage.trim() && (
          <div className="rounded-2xl p-4 mb-5 print:hidden" style={{ background: C.pitchTint, border: `1px solid ${C.pitch}` }}>
            <p className="text-sm" style={{ color: C.pitchDark, whiteSpace: "pre-wrap" }}>📣 {parentMessage}</p>
          </div>
        )}
        <div className="rounded-2xl p-5 mb-5 flex items-center justify-between flex-wrap gap-3" style={{ background: C.navy, color: "#fff" }}>
          <div><p className="font-black text-lg">{player.name}</p><p className="text-xs opacity-80">{label}</p></div>
          <span className="text-2xl font-black" style={{ fontVariantNumeric: "tabular-nums" }}>{fmtMoney(Math.abs(balance))}</span>
        </div>
        <StatementDetail teamName={teamName} player={player} month={month} setMonth={setMonth} stats={stats} />
      </main>
    </div>
  );
}

/* ---------------------------------------------------------------
   Root app
---------------------------------------------------------------- */
function App() {
  const [ready, setReady] = useState(false);
  const [players, setPlayers] = useState([]);
  const [transactions, setTransactions] = useState([]);
  const [teamName, setTeamNameState] = useState("U13 Boys Team Treasury");
  const [parentMessage, setParentMessageState] = useState("");
  const [pin, setPinState] = useState(null);
  const [screen, setScreen] = useState("landing");
  const [forceChangePin, setForceChangePin] = useState(false);
  const [parentPlayerId, setParentPlayerId] = useState(null);

  useEffect(() => {
    const db = window.db, auth = window.auth;
    let unsubPlayers, unsubTxns, unsubTeam;
    const unsubAuth = auth.onAuthStateChanged((user) => {
      if (!user) { auth.signInAnonymously().catch((e) => console.error("Auth error:", e)); return; }
      unsubPlayers = db.collection("players").onSnapshot((snap) => setPlayers(snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), (e) => console.error(e));
      unsubTxns = db.collection("transactions").onSnapshot((snap) => setTransactions(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), (e) => console.error(e));
      unsubTeam = db.collection("meta").doc("team").onSnapshot((doc) => { if (doc.exists) { setTeamNameState(doc.data().teamName || "U13 Boys Team Treasury"); setParentMessageState(doc.data().parentMessage || ""); } });
      db.collection("meta").doc("admin").get().then((doc) => setPinState(doc.exists ? doc.data().pin : null));
      setReady(true);
    });
    return () => { unsubAuth && unsubAuth(); unsubPlayers && unsubPlayers(); unsubTxns && unsubTxns(); unsubTeam && unsubTeam(); };
  }, []);

  const addPlayer = useCallback(async (p) => { await window.db.collection("players").add(p); }, []);
  const addPlayersBulk = useCallback(async (playerObjs) => {
    const col = window.db.collection("players");
    for (let i = 0; i < playerObjs.length; i += 400) {
      const batch = window.db.batch();
      playerObjs.slice(i, i + 400).forEach((p) => { const ref = col.doc(); batch.set(ref, p); });
      await batch.commit();
    }
  }, []);
  const updatePlayer = useCallback(async (id, patch) => { await window.db.collection("players").doc(id).update(patch); }, []);
  const deletePlayer = useCallback(async (id) => {
    await window.db.collection("players").doc(id).delete();
    const snap = await window.db.collection("transactions").where("playerId", "==", id).get();
    await commitInChunks(snap);
  }, []);
  const addTxn = useCallback(async (t) => { await window.db.collection("transactions").add(t); }, []);
  const addBulkTxn = useCallback(async (playerIds, base) => {
    const col = window.db.collection("transactions");
    for (let i = 0; i < playerIds.length; i += 400) {
      const batch = window.db.batch();
      playerIds.slice(i, i + 400).forEach((pid) => { const ref = col.doc(); batch.set(ref, { ...base, playerId: pid }); });
      await batch.commit();
    }
  }, []);
  const deleteTxn = useCallback(async (id) => { await window.db.collection("transactions").doc(id).delete(); }, []);
  const updateTxn = useCallback(async (id, patch) => { await window.db.collection("transactions").doc(id).update(patch); }, []);
  const setTeamName = useCallback(async (name) => { await window.db.collection("meta").doc("team").set({ teamName: name }, { merge: true }); }, []);
  const setParentMessage = useCallback(async (msg) => { await window.db.collection("meta").doc("team").set({ parentMessage: msg }, { merge: true }); }, []);
  const setPin = useCallback(async (p) => { await window.db.collection("meta").doc("admin").set({ pin: p }, { merge: true }); setPinState(p); }, []);
  const resetAll = useCallback(async () => {
    const ps = await window.db.collection("players").get(); await commitInChunks(ps);
    const ts = await window.db.collection("transactions").get(); await commitInChunks(ts);
  }, []);
  const archiveSeason = useCallback(async (label, carryForward) => {
    const snapshotPlayers = players.map((p) => ({ ...p }));
    const snapshotTransactions = transactions.map((t) => ({ ...t }));
    const balanceOf = (playerId) => {
      const p = snapshotPlayers.find((pl) => pl.id === playerId);
      let bal = Number(p?.openingBalance) || 0;
      for (const t of snapshotTransactions) { if (t.playerId !== playerId) continue; bal += t.direction === "credit" ? t.amount : -t.amount; }
      return bal;
    };
    await window.db.collection("archives").add({
      label: label.trim() || `Season archived ${todayStr()}`,
      archivedAt: new Date().toISOString(),
      teamName,
      players: snapshotPlayers,
      transactions: snapshotTransactions,
    });
    const ts = await window.db.collection("transactions").get();
    await commitInChunks(ts);
    const playersCol = window.db.collection("players");
    for (let i = 0; i < snapshotPlayers.length; i += 400) {
      const batch = window.db.batch();
      snapshotPlayers.slice(i, i + 400).forEach((p) => {
        batch.update(playersCol.doc(p.id), { openingBalance: carryForward ? balanceOf(p.id) : 0 });
      });
      await batch.commit();
    }
  }, [teamName, players, transactions]);
  const restoreFromBackup = useCallback(async (backup) => {
    const ps = await window.db.collection("players").get(); await commitInChunks(ps);
    const ts = await window.db.collection("transactions").get(); await commitInChunks(ts);
    if (backup.teamName) await window.db.collection("meta").doc("team").set({ teamName: backup.teamName }, { merge: true });
    const playersCol = window.db.collection("players");
    const playerList = backup.players || [];
    for (let i = 0; i < playerList.length; i += 400) {
      const batch = window.db.batch();
      playerList.slice(i, i + 400).forEach((p) => { const { id, ...data } = p; batch.set(playersCol.doc(id), data); });
      await batch.commit();
    }
    const txnsCol = window.db.collection("transactions");
    const txnList = backup.transactions || [];
    for (let i = 0; i < txnList.length; i += 400) {
      const batch = window.db.batch();
      txnList.slice(i, i + 400).forEach((t) => { const { id, ...data } = t; batch.set(txnsCol.doc(id), data); });
      await batch.commit();
    }
  }, []);

  if (!ready) return <div className="min-h-screen flex items-center justify-center" style={{ background: C.bg }}><Spinner size={22} /></div>;

  let body;
  if (screen === "landing") body = <Landing teamName={teamName} onPickAdmin={() => setScreen("adminGate")} onPickParent={() => setScreen("parentGate")} />;
  else if (screen === "adminGate") body = <AdminGate pin={forceChangePin ? null : pin} onSetPin={async (p) => { await setPin(p); setForceChangePin(false); setScreen("admin"); }} onUnlock={() => setScreen("admin")} onBack={() => { setScreen("landing"); setForceChangePin(false); }} />;
  else if (screen === "admin") body = <AdminShell teamName={teamName} setTeamName={setTeamName} parentMessage={parentMessage} setParentMessage={setParentMessage} players={players} transactions={transactions} addPlayer={addPlayer} addPlayersBulk={addPlayersBulk} updatePlayer={updatePlayer} deletePlayer={deletePlayer} addTxn={addTxn} addBulkTxn={addBulkTxn} deleteTxn={deleteTxn} updateTxn={updateTxn} onLock={(changePin) => { setScreen("adminGate"); setForceChangePin(!!changePin); }} onResetAll={resetAll} onRestoreBackup={restoreFromBackup} onArchiveSeason={archiveSeason} />;
  else if (screen === "parentGate") body = <ParentGate players={players} onVerified={(id) => { setParentPlayerId(id); setScreen("parent"); }} onBack={() => setScreen("landing")} />;
  else if (screen === "parent") body = <ParentView teamName={teamName} parentMessage={parentMessage} players={players} transactions={transactions} playerId={parentPlayerId} onLogout={() => { setParentPlayerId(null); setScreen("landing"); }} />;

  return <div style={{ fontFamily: "ui-sans-serif, system-ui, -apple-system, sans-serif" }}>{body}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
